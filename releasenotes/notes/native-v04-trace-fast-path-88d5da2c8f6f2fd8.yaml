---
features:
  - |
    Add an opt-in trace fast path (``ENABLE_TRACE_FAST_PATH=true`` or ``--enable-trace-fast-path``) for tracers that
    send many spans. Each stored trace payload is rendered to JSON once instead of on every
    ``/test/session/traces`` query, and when the optional native extension is built, v0.4 msgpack payloads
    are validated and transcoded in C. Responses and logs are unchanged.
