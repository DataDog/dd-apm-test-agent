---
features:
  - |
    v1: Decode ``List``, ``KeyValue`` and ``Bytes`` attribute values. On spans and span links, lists and key-value lists are flattened to ``key.N`` / ``key.member`` (strings in ``meta``, numbers and booleans in ``metrics``, string leaves on links). ``Bytes`` values are decoded as msgpack into ``meta_struct`` or, if not msgpack, as ASCII strings. On span events, key-value lists are stored as JSON string values.
