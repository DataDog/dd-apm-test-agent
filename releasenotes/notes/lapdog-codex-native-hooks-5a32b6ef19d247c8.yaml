fixes:
  - |
    Lapdog: Fixes missing Codex tool outputs and multiple tool executions
    being combined into one span. Each tool execution now keeps its own
    input and output.
upgrade:
  - |
    Lapdog: Live Codex capture now requires Codex CLI 0.124.0 or newer.
    Lapdog registers global hooks. Review and trust them in Codex with
    ``/hooks`` before use; ``lapdog uninstall`` removes them.
    On macOS, quit Codex desktop before launching it with ``lapdog codex app``
    so Lapdog can attach capture to that app process. Desktop process capture
    on other operating systems is not supported.
